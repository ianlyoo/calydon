[package]
name = "calydon"
version = "1.1.0"
edition = "2024"
publish = false
description = "A memecoin you hunt together: commit tokens against the beast's HP before the deadline."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"
near-contract-standards = "=5.30.1"
uint = { version = "0.10", default-features = false }

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["non-contract-usage"] }
near-workspaces = { version = "=0.24.0", features = ["experimental"] }
near-sandbox = "=0.4.0"
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
futures = "0.3"
num-bigint = "=0.3.3"
num-traits = "0.2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = true
